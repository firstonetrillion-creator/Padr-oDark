<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bench 45 — Arquivo Noturno</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0A0A0B; }
  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #0A0A0B;
    font-family: Georgia, "Times New Roman", serif;
    color: #E8E6E1;
  }
  .bg {
    position: absolute;
    inset: -80px;
    background:
      radial-gradient(900px 700px at 30% 20%, rgba(178,58,46,0.12), transparent 60%),
      radial-gradient(1200px 900px at 70% 80%, rgba(60,70,90,0.18), transparent 65%),
      linear-gradient(160deg, #101014 0%, #0A0A0B 55%, #08080A 100%);
    transform: scale(1.08);
  }
  .vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 420px 120px rgba(0,0,0,0.85);
  }
  .frame {
    position: absolute;
    inset: 70px;
    border: 1px solid rgba(232,230,225,0.10);
  }
  .mark {
    position: absolute;
    top: 120px;
    left: 100px;
    font-family: Inter, Arial, sans-serif;
    font-size: 22px;
    letter-spacing: 8px;
    color: #6B6B70;
  }
  .line {
    position: absolute;
    left: 100px;
    top: 1180px;
    width: 0;
    height: 3px;
    background: #B23A2E;
  }
  .block {
    position: absolute;
    left: 100px;
    right: 100px;
    text-align: left;
  }
  .block h1 {
    margin: 0;
    font-weight: 400;
    line-height: 0.98;
    letter-spacing: -2px;
  }
  .b1 { top: 760px; }
  .b1 h1 { font-size: 148px; }
  .b2 { top: 820px; }
  .b2 h1 { font-size: 74px; letter-spacing: 6px; font-family: Inter, Arial, sans-serif; color: #B23A2E; }
  .b3 { top: 700px; }
  .b3 h1 { font-size: 126px; }
  .b4 { top: 820px; }
  .b4 h1 { font-size: 104px; }
  .b5 { top: 760px; }
  .b5 h1 { font-size: 112px; }
  .small {
    display: block;
    margin-top: 34px;
    font-family: Inter, Arial, sans-serif;
    font-size: 30px;
    letter-spacing: 4px;
    color: #6B6B70;
    line-height: 1.4;
  }
  .foot {
    position: absolute;
    bottom: 110px;
    left: 100px;
    font-family: Inter, Arial, sans-serif;
    font-size: 21px;
    letter-spacing: 5px;
    color: #4A4A50;
  }
</style>
</head>
<body>
<div id="stage" data-composition-id="bench45" data-start="0" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="vignette"></div>
  <div class="frame"></div>
  <div class="mark">ARQUIVO NOTURNO</div>
  <div class="line" id="line"></div>

  <div class="block b1 clip" data-start="0" data-duration="6" data-track-index="1">
    <h1 id="t1">ARQUIVO<br>NOTURNO</h1>
    <span class="small">DOSSIÊ 001 — EILEAN MOR</span>
  </div>

  <div class="block b2 clip" data-start="6" data-duration="8" data-track-index="1">
    <h1 id="t2">EILEAN MOR · 1900</h1>
    <span class="small">30 KM DA COSTA · ESCÓCIA</span>
  </div>

  <div class="block b3 clip" data-start="14" data-duration="10" data-track-index="1">
    <h1 id="t3">TRÊS HOMENS.<br>NENHUM RASTRO.</h1>
    <span class="small">A PORTA ESTAVA FECHADA</span>
  </div>

  <div class="block b4 clip" data-start="24" data-duration="10" data-track-index="1">
    <h1 id="t4">O FAROL<br>ESTAVA VAZIO.</h1>
    <span class="small">NENHUM CORPO FOI ENCONTRADO</span>
  </div>

  <div class="block b5 clip" data-start="34" data-duration="11" data-track-index="1">
    <h1 id="t5">O ARQUIVO FOI<br>FECHADO.<br>A PERGUNTA, NÃO.</h1>
  </div>

  <div class="foot">FONTE · NORTHERN LIGHTHOUSE BOARD</div>

  <script src="gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 45 }, 0);
    tl.fromTo(".bg", { scale: 1.08 }, { scale: 1.18, duration: 45, ease: "none" }, 0);
    tl.fromTo("#line", { width: 0 }, { width: 360, duration: 1.6, ease: "power2.out" }, 0.2);

    tl.from("#t1", { opacity: 0, y: 60, duration: 1.2, ease: "power2.out" }, 0.15);
    tl.from("#t2", { opacity: 0, y: 40, duration: 0.9, ease: "power2.out" }, 6.1);
    tl.from("#t3", { opacity: 0, y: 50, duration: 0.9, ease: "power2.out" }, 14.1);
    tl.from("#t4", { opacity: 0, y: 50, duration: 0.9, ease: "power2.out" }, 24.1);
    tl.from("#t5", { opacity: 0, y: 50, duration: 1.0, ease: "power2.out" }, 34.1);
    window.__timelines = window.__timelines || {};
    window.__timelines.bench45 = tl;
  </script>
</div>
</body>
</html>
